name: Auto Re Gost Pure
on:
  schedule:
    - cron: '0 */3 * * *' 
  workflow_dispatch: 

jobs:
  run-renew:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip wget curl
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      - name: 安装 Linux OpenVPN 客户端
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn resolvconf

      - name: 释放你指定的黄金节点配置文件
        run: |
          # 从 GitHub Secrets 中安全读取你填入的配置文件文本，并写入虚拟机的临时文件中
          cat << 'EOF' > runner_target.ovpn
          ${{ secrets.SELECTED_OVPN_DATA }}
          EOF

      - name: 启动 OpenVPN 加密隧道 (全接管全局路由模式)
        run: |
          # 启动 VPN 实例并转入后台运行
          sudo openvpn --config runner_target.ovpn --daemon vpn_instance
          
          echo "[*] 正在等待加密隧道握手与网卡路由调配..."
          # 预留 8 秒给 OpenVPN 完成与目标节点的物理握手
          sleep 8

      - name: 物理落地 IP 属性验证
        run: |
          echo "=== 正在验证当前虚拟机容器的出口真实 IP ==="
          # 如果隧道打通，这里打印出来的就是你指定的那个高清洁度节点的海外 IP 了
          curl --connect-timeout 10 http://ip-api.com/json/?lang=zh-CN || true


      - name: Run Renew Script
        env:
          RENEW_URL: ${{ secrets.RENEW_URL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SOCKS5_URL: ${{ secrets.SOCKS5_URL }}
          PROXY: 127.0.0.1:1080
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python main2.py

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: debug-data
          # 收集截图、HTML 源码以及音频缓存文件用于排查
          path: |
            ./*.html
            ./*.png
            ./*.wav
          retention-days: 1
